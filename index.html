    function makeFallbackParticipantId(condition) {
        // When the server cannot reserve a sequence number, use a nonsequential
        // high-entropy placeholder; NEVER pretend a local counter is global.
        const random = new Uint32Array(1);
        crypto.getRandomValues(random);
        return `P${String(random[0]).padStart(10, "0")}_${CONDITION_SUFFIX[condition]}`;
    }
    function makeSequentialParticipantId(number, condition) {
        return `P${String(number).padStart(3, "0")}_${CONDITION_SUFFIX[condition]}`;
    }

    function randomCondition() {
        const random = new Uint32Array(1);
        crypto.getRandomValues(random);
        // Rejection sampling avoids modulo bias across the three conditions.
        const limit = 4294967296 - (4294967296 % CONDITIONS.length);
        while (random[0] >= limit) crypto.getRandomValues(random);
        return CONDITIONS[random[0] % CONDITIONS.length];
    }

    let assignmentPromise = null;

    // Asked once per session, right after consent. The server returns the
    // condition with the fewest completed participants (ties broken at random),
    // so the three groups stay close in size. Any failure falls back to random.
    async function prefetchCondition() {
        const session = state.session;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        try {
            const response = await fetch(`${SUBMIT_URL}?action=assign`, { signal: controller.signal });
            const result = await response.json();
            if (session === state.session && !state.condition && CONDITIONS.includes(result.condition)) {
                state.suggestedCondition = result.condition;
                if (
                    typeof result.participant_id === "string" &&
                    result.participant_id ===
                        `participant_${result.condition}_${result.participant_number}`
                ) {
                    state.suggestedParticipantId = result.participant_id;
                }
            }
        } catch (err) {
            console.warn("Balanced assignment unavailable. Participant assignment will be retried.", err);
        } finally {
            clearTimeout(timer);
        }
    }

    // Called when the participant leaves the background survey. Every new
    // session (page load or START A NEW SESSION) gets a new assignment and ID.
    
    function assignCondition() {
        if (state.condition && state.participantId) {
            return true;
        }

        if (
            !state.suggestedCondition ||
            !state.suggestedParticipantId
        ) {
            return false;
        }

        state.condition = state.suggestedCondition;
        state.participantId = state.suggestedParticipantId;
        state.assignmentMethod = "balanced";

        return true;
    }

    function setStage(stage) {

        state.stage = stage;
        render();
        if (stage === "scenario" && !wasScenario) {
            state.scenarioTimerStartedAt = performance.now();
        }
        scrollTop();
    }

    // Shuffle only when a scenario is first shown. Re-renders and returning
    // from the confidence screen must not move choices under the participant.
    function scenarioOptionOrder(index) {
        if (!state.optionOrders[index]) {
            const order = [0, 1, 2];
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }
            state.optionOrders[index] = order;
        }
        return state.optionOrders[index];
    }

        const s = scenarios[state.current];
        return `
  <section class="confidence-stage"><div class="confidence-card panel"><div class="panel-index">${String(state.current + 1).padStart(2, "0")}</div>
    <p class="kicker">CHOICE RECORDED</p><div class="choice-confirmation"><span>${displayChoiceLetter(state.current, state.selected)}</span><div><small>YOUR DECISION</small><strong>${state.selected === 3 ? "Skip this salvage opportunity" : s.options[state.selected].title}</strong></div></div>
    <h1>How confident are you <em>in this choice?</em></h1><p class="confidence-instruction">Select the point that best reflects how certain you feel right now, or continue without a rating.</p>
    <div class="confidence-scale" role="radiogroup" aria-label="Confidence rating"><div class="scale-line"></div>
      ${confidenceLabels.map((label, i) => `<button data-confidence="${i + 1}" role="radio" aria-checked="${state.confidence === i + 1}" class="${state.confidence === i + 1 ? "selected" : ""}"><span class="confidence-dot"><i></i></span><strong>${i + 1}</strong><small>${label}</small></button>`).join("")}
    </div>
    <fieldset class="decision-factors">
      <legend>What influenced your decision? <span>(SELECT ALL THAT APPLY)</span></legend>
      <p>Select any factors that influenced your choice, or leave this question blank.</p>
      <div class="decision-factor-grid">
        ${DECISION_FACTORS.map(factor => `<label class="decision-factor-choice"><input type="checkbox" data-decision-factor="${factor.id}" value="${factor.id}" ${state.decisionFactors.includes(factor.id) ? "checked" : ""}><span>${escapeHTML(factor.text)}</span></label>`).join("")}
      </div>
      
<div id="otherFactorField"
     class="other-factor-field"
     ${state.decisionFactors.includes("other") ? "" : "hidden"}>

    <label for="otherFactorText">
        Other factor(s) — please describe
    </label>

    <textarea
        id="otherFactorText"
        maxlength="500"
        rows="3"
        placeholder="Type your response here (optional)"
    >${escapeHTML(state.otherDecisionText)}</textarea>

</div>
    </fieldset>
    <div class="form-actions confidence-actions"><button class="text-button" id="backButton">${arrow("left")} CHANGE CHOICE</button><button class="primary-button compact" id="revealOutcome">REVEAL OUTCOME ${arrow()}</button></div>
  </div></section>`;
    }

    function renderOutcome() {
        const r = state.lastResult;
        return `
  <section class="outcome-stage"><div class="outcome-card panel ${r.success ? "success" : "failure"}">
    <div class="result-orb"><span>${r.skipped ? "–" : r.success ? "✓" : "✕"}</span></div><p class="kicker">SALVAGE OPERATION // COMPLETE</p>
    <h1>${r.skipped ? "Salvage skipped." : r.success ? "Recovery successful." : "Recovery failed."}</h1>
    <p>${r.skipped ? "You chose not to attempt salvage at this location. Your credit balance is unchanged." : r.success ? scenarios[state.current].successText : scenarios[state.current].failureText}</p>
    <div class="result-value"><span>${r.skipped ? "CREDITS CHANGED" : r.success ? "CREDITS EARNED" : "CREDITS LOST"}</span><strong>${r.delta > 0 ? "+" : ""}${r.delta} CR</strong><small>Current balance: ${state.credits} total credits</small></div>
    <div class="result-fund"><div class="progress-meta"><span>HYPERDRIVE FUND</span><strong>${state.credits} / 100 CR</strong></div><div class="credit-track large"><span style="width:${Math.max(0, Math.min(state.credits, 100))}%"></span><i></i></div><small>${Math.max(0, 100 - state.credits)} credits still needed to reach The Prism</small></div>
    <button class="primary-button" id="continueOutcome">${state.current === scenarios.length - 1 ? "VIEW MISSION RESULT" : "CONTINUE TO NEXT LOCATION"} ${arrow()}</button>
  </div></section>`;
    }

    function renderComplete() {
        const successfulSalvages = state.answers.filter(answer => answer?.success === true && !answer.skipped).length;
        return `
  <section class="complete-stage"><p class="kicker">MISSION COMPLETE</p>
    <h1>${state.credits >= 100 ? "Hyperdrive Secured!" : "Contract Incomplete"}</h1>
    <p>${state.credits >= 100 ? `Congratulations! You successfully earned enough credits to purchase a replacement hyperdrive. Your ship is repaired, and you are finally ready to begin your journey home.` : `Unfortunately, your salvage expedition did not generate enough credits to purchase a replacement hyperdrive. Your ship remains stranded, but at least you can sell the remaining materials and try again another day.`} Thank you for contributing to this decision-making study.</p>
    <div class="completion-stats"><div><span>FINAL<br>BALANCE</span><strong>${state.credits} CR</strong></div><div><span>CONTRACT<br>GOAL</span><strong>100 CR</strong></div><div><span>SUCCESSFUL SALVAGES</span><strong>${successfulSalvages}/${scenarios.length}</strong></div></div>
    <div class="debrief"><span>DEBRIEF</span><p>This study explores how people weigh risk, rules, cooperation, and uncertainty in fictional high-pressure situations. There were no correct or incorrect answers.</p></div>
    ${renderSubmitStatus()}
    <button class="text-button restart" id="restartStudy">START A NEW SESSION</button>
  </section>`;
    }

    function renderSubmitStatus() {
        if (state.submitStatus === "sent") {
            return `<p class="submit-status ok">Your responses have been saved. Thank you! You may now close this tab.</p>`;
        }
        if (state.submitStatus === "failed") {
            return `<p class="submit-status error">We couldn't save your responses automatically. Please try again. If it still fails, download your results and email the file to one of the researchers listed on the consent page.</p>
    <button class="primary-button" id="retrySubmit">TRY AGAIN</button>
    <button class="text-button restart" id="downloadResults">DOWNLOAD RESULTS INSTEAD</button>`;
        }
        return `<p class="submit-status">Saving your responses… please keep this tab open.</p>`;
    }
    function render() {
        renderHeader();
        updateBackground();
        const views = {
            consent: renderConsent,
            demographics: renderDemographics,
            briefing: renderBriefing,
            scenario: renderScenario,
            confidence: renderConfidence,
            outcome: renderOutcome,
            complete: renderComplete
        };
        main.innerHTML = views[state.stage]();
        bindEvents();
    }

    function bindEvents() {
        const adultCheck = $("#adultCheck");
        const consentCheck = $("#consentCheck");
        const agreeButton = $("#agreeButton");

        function updateConsentButton() {
            if (agreeButton) {
                agreeButton.disabled = !(
                    state.adult && state.consented
                );
            }
        }

        if (adultCheck) {
            adultCheck.addEventListener("change", (e) => {
                state.adult = e.target.checked;
                updateConsentButton();
            });
        }

        if (consentCheck) {
            consentCheck.addEventListener("change", (e) => {
                state.consented = e.target.checked;
                updateConsentButton();
            });
        }

        const agreeButtonElement = $("#agreeButton");

        if (agreeButtonElement) {
            agreeButtonElement.addEventListener("click", () => {
                if (state.adult && state.consented) {
                    assignmentPromise = prefetchCondition();
                    setStage("demographics");
                }
            });
        }

        document.querySelectorAll("[data-demographic]").forEach(el => {
            el.addEventListener("change", e => {
                state.demographics[e.target.dataset.demographic] = e.target.value;
            });
        });
        document.querySelectorAll("[data-game-genre]").forEach(el => {
            el.addEventListener("change", () => {
                const none = "I do not play video games";
                if (el.checked && el.value === none) {
                    document.querySelectorAll("[data-game-genre]").forEach(box => {
                        if (box !== el) box.checked = false;
                    });
                } else if (el.checked) {
                    const noneBox = Array.from(document.querySelectorAll("[data-game-genre]")).find(box => box.value === none);
                    if (noneBox) noneBox.checked = false;
                }
                state.demographics.gameGenres = Array.from(document.querySelectorAll("[data-game-genre]:checked"), box => box.value);
            });
        });
        document.querySelectorAll("[data-grips]").forEach(el => {
            el.addEventListener("change", e => {
                state.demographics.grips[Number(e.target.dataset.grips)] = Number(e.target.value);
            });
        });
        const back = $("#backButton");
        if (back) back.addEventListener("click", goBack);
        const exitButton = $("#exitStudyButton");
        if (exitButton) {
            exitButton.addEventListener("click", exitStudy);
        }
        const enter = $("#enterField");

        if (enter) {
            enter.addEventListener("click", async () => {
                
enter.disabled = true;

try {
    if (assignmentPromise) {
        await assignmentPromise;
    }

    if (!state.suggestedParticipantId) {
        assignmentPromise = prefetchCondition();
        await assignmentPromise;
    }

    if (!assignCondition()) {
        alert(
            "A participant ID could not be assigned. " +
            "Please check your connection and try again."
        );
        return;
    }

    setStage("briefing");
} finally {
    enter.disabled = false;
}

            });
        }
        const begin = $("#beginRun");
        if (begin) begin.addEventListener("click", () => setStage("scenario"));

        document.querySelectorAll("[data-choice]").forEach(el => el.addEventListener("click", () => {
            state.selected = Number(el.dataset.choice); render();
        }));
        const lock = $("#lockChoice");
        if (lock) lock.addEventListener("click", () => { if (state.selected !== null) setStage("confidence"); });

        document.querySelectorAll("[data-confidence]").forEach(el => el.addEventListener("click", () => {
            state.confidence = Number(el.dataset.confidence); render();
        }));
        
        document.querySelectorAll("[data-decision-factor]").forEach(box => {
            box.addEventListener("change", () => {
                state.decisionFactors = Array.from(
                    document.querySelectorAll("[data-decision-factor]:checked"),
                    item => item.value
                );

                const otherField = $("#otherFactorField");

                if (otherField) {
                    otherField.hidden =
                        !state.decisionFactors.includes("other");
                }
            });
        });

        const otherFactorText = $("#otherFactorText");

        if (otherFactorText) {
            otherFactorText.addEventListener("input", e => {
                state.otherDecisionText = e.target.value;
            });
        }

        const reveal = $("#revealOutcome");
        if (reveal) reveal.addEventListener("click", submitConfidence);
        const cont = $("#continueOutcome");
        if (cont) cont.addEventListener("click", continueFromOutcome);
        const restart = $("#restartStudy");
        if (restart) restart.addEventListener("click", resetStudy);
        const retryButton = $("#retrySubmit");
        if (retryButton) retryButton.addEventListener("click", submitResults);
        const downloadButton = $("#downloadResults");
        if (downloadButton) {
            downloadButton.addEventListener("click", downloadCSV);
        }
    }

    function submitConfidence() {
        if (state.selected === null) return;
        if (state.selected === 3) {
            state.answers[state.current] = { choice: state.selected, confidence: state.confidence, decisionFactors: [...state.decisionFactors], otherDecisionText: state.decisionFactors.includes("other")
    ? state.otherDecisionText.trim()
    : "", success: null, delta: 0, skipped: true };
            state.lastResult = { success: false, skipped: true, delta: 0 };
        } else {
            const option = scenarios[state.current].options[state.selected];
            const probability = option.probability / 100;
            const randomValue = new Uint32Array(1);
            crypto.getRandomValues(randomValue);
            const roll = randomValue[0] / 4294967296;
            const success = roll < probability;
            const delta = success ? option.reward : -Math.min(option.penalty, state.credits);
            state.answers[state.current] = { choice: state.selected, confidence: state.confidence, decisionFactors: [...state.decisionFactors], otherDecisionText: state.decisionFactors.includes("other")
    ? state.otherDecisionText.trim()
    : "", success, delta, skipped: false, successProbability: option.probability, probabilityRoll: roll };
            state.lastResult = { success, skipped: false, delta };
            state.credits = Math.max(0, state.credits + delta);
        }
        setStage("outcome");
    }
    function continueFromOutcome() {
        if (state.current === scenarios.length - 1) {
            state.studyFinishedAt = performance.now();
            setStage("complete");
            submitResults();
        }
        else {
            state.current++; state.selected = null; state.confidence = null; state.decisionFactors = []; state.lastResult = null; state.otherDecisionText = "";
            state.scenarioAccumulatedMs = 0; state.scenarioTimerStartedAt = null;
            setStage("scenario");
        }
    }
    function goBack() {
        if (state.stage === "confidence") {
            setStage("scenario");
        }
    }
    function resetStudy() {
        state.participantId = null;
        state.condition = null;
        state.suggestedCondition = null;
        state.suggestedParticipantId = null;
        assignmentPromise = null;
        state.idSource = "";
        state.studyStartedAt = performance.now();
        state.studyFinishedAt = null;
        state.assignmentMethod = "";
        state.session += 1; // Ignore any assignment reply still in flight from the old session.
        state.submitStatus = "idle";
        state.stage = "consent"; state.consented = false; state.adult = false; state.current = 0;
        state.selected = null; state.confidence = null; state.decisionFactors = []; state.credits = 0; state.lastResult = null;
        state.otherDecisionText = "";
        state.answers = []; state.optionOrders = []; state.decisionTimesMs = [];
        state.scenarioTimerStartedAt = null; state.scenarioAccumulatedMs = 0;
        state.demographics = { age: "", gender: "", education: "", gaming: "", major: "", grips: Array(8).fill(null), gameGenres: [] };
        render(); scrollTop();
    }
    const RESULT_COLUMNS = [
        "participant_id", "experimental_condition", "assignment_method",
        "total_study_time_seconds", "age_range", "gender_identity", "highest_education",
        "major_field_of_study", "video_game_experience", "video_game_types",
        ...GRIPS_ITEMS.map((_, i) => `grips_q${i + 1}`), "grips_mean_score",
        "scenario", "scenario_title", "choice", "selected_risk",
        "success_probability_percent", "probability_roll", "confidence",
        "decision_factors", ...DECISION_FACTORS.map(f => `decision_factor_${f.id}`), "decision_factor_other_text",
        "decision_time_seconds", "success", "skipped", "credit_change", "final_credits"
    ];
    function buildResultRows() {
        const grips = state.demographics.grips || [];
        const answered = grips.filter(n => Number.isInteger(n) && n >= 1 && n <= 5);
        const mean = answered.length === GRIPS_ITEMS.length
            ? (answered.reduce((a, b) => a + b, 0) / GRIPS_ITEMS.length).toFixed(3)
            : "";
        const duration = state.studyFinishedAt == null ? "" :
            ((state.studyFinishedAt - state.studyStartedAt) / 1000).toFixed(3);
        return state.answers.map((answer, index) => {
            const factors = answer.decisionFactors || [];
            return {
                participant_id: state.participantId,
                experimental_condition: state.condition,
                assignment_method: state.assignmentMethod,
                total_study_time_seconds: duration,
                age_range: state.demographics.age,
                gender_identity: state.demographics.gender,
                highest_education: state.demographics.education,
                major_field_of_study: state.demographics.major,
                video_game_experience: state.demographics.gaming,
                video_game_types: (state.demographics.gameGenres || []).join("; "),
                ...Object.fromEntries(GRIPS_ITEMS.map((_, i) => [`grips_q${i + 1}`, grips[i] ?? ""])),
                grips_mean_score: mean,
                scenario: index + 1,
                scenario_title: scenarios[index].title,
                choice: displayChoiceLetter(index, answer.choice),
                selected_risk: answer.skipped ? "NO ACTION" : scenarios[index].options[answer.choice].risk,
                success_probability_percent: answer.successProbability ?? "",
                probability_roll: answer.probabilityRoll ?? "",
                confidence: answer.confidence ?? "",
                decision_factors: factors.join("; "),
                ...Object.fromEntries(DECISION_FACTORS.map(f => [`decision_factor_${f.id}`, factors.includes(f.id) ? 1 : 0])),
                decision_factor_other_text: answer.otherDecisionText || "",
                decision_time_seconds: state.decisionTimesMs[index] == null ? "" : (state.decisionTimesMs[index] / 1000).toFixed(3),
                success: answer.success,
                skipped: answer.skipped,
                credit_change: answer.delta,
                final_credits: state.credits
            };
        });
    }
    async function submitResults() {
        if (state.submitStatus === "sending" || state.submitStatus === "sent") return;
        state.submitStatus = "sending";
        if (state.stage === "complete") render();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        try {
            // No Content-Type header on purpose: the browser sends text/plain,
            // which avoids a CORS preflight that Apps Script can't answer.
            const response = await fetch(SUBMIT_URL, {
                method: "POST",
                body: JSON.stringify({ participant_id: state.participantId, rows: buildResultRows() }),
                signal: controller.signal
            });
            const result = await response.json();
            if (!result.ok) throw new Error(result.error || "Server rejected submission");
            state.submitStatus = "sent";
        } catch (err) {
            console.error("Submission failed:", err);
            state.submitStatus = "failed";
        } finally {
            clearTimeout(timer);
        }
        if (state.stage === "complete") render();
    }
    function downloadCSV() {
        const columns = RESULT_COLUMNS;
        const rows = buildResultRows();
        const escapeCSV = value => {
            const text = value == null ? "" : String(value);
            return `"${text.replaceAll('"', '""')}"`;
        };

        const csv = [
            columns.join(","),
            ...rows.map(row =>
                columns.map(col => escapeCSV(row[col])).join(",")
            )
        ].join("\r\n");

        const blob = new Blob([csv], {
            type: "text/csv;charset=utf-8"
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = `participant_${state.participantId}.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    render();

</script>
</body>
</html>
